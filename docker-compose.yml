services:
  scoutanalyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scoutanalyzer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - STORAGE_BACKEND=local
      - SCOUT_DB_PATH=/app/data/scoutanalyzer.db
      - JWT_SECRET_KEY=synology-scoutanalyzer-secret-key-change-me
      - S3_ENDPOINT_URL=
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
      - S3_BUCKET_NAME=
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./config:/app/config
      - ./src:/app/src
      - ./static:/app/static
      - ./database:/app/database
      - ./web_app.py:/app/web_app.py
