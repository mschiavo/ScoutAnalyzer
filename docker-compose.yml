services:
  scoutanalyzer:
    build: .
    container_name: scoutanalyzer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SCOUT_NAS_MODE: "1"
      SCOUT_DB_PATH: /app/data/scoutanalyzer.db
      STORAGE_BACKEND: local
      STORAGE_DIR: /app/storage/dvw
      JWT_SECRET: "${JWT_SECRET:?Imposta JWT_SECRET nel file .env}"
      SCOUT_ADMIN_PASSWORD: "${SCOUT_ADMIN_PASSWORD:-}"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - ./config:/app/config
