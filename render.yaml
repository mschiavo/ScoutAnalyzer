services:
  - type: web
    name: scoutanalyzer-3000
    runtime: python
    buildCommand: "pip install -r requirements.txt && python database/setup_db.py"
    startCommand: "uvicorn web_app:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        value: https://43ba6ad8c9582bba26c5261844a877f3.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: scoutanalyzer-dvw
      - key: JWT_SECRET_KEY
        generateValue: true
